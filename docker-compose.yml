version: "3.9"

services:
  prompt-hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: prompt-hub:latest
    container_name: prompt-hub-7000
    restart: unless-stopped
    ports:
      - "7000:7000"
    volumes:
      - prompt_hub_data:/app/data
    environment:
      - DB_PATH=/app/data/db.sqlite3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7000/')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  prompt_hub_data:
    name: prompt_hub_data
